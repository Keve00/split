name: Publicar Split no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - "src/**"
      - "scripts/**"
      - "server/**"
      - "tests/**"
      - ".github/workflows/pages.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar ferramentas
        run: npm ci --omit=optional
      - name: Conferir formatação e build
        run: |
          npm run format:check
          npm run check:dist
      - name: Rodar testes
        run: node tests/validate.cjs

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos estáticos
        run: |
          test -f dist/index.html
          touch dist/.nojekyll
          # Troca ?v=dev pelo commit publicado para o navegador buscar arquivos novos.
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" dist/index.html
      - name: Enviar app
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
